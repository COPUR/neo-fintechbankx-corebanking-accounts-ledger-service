{{- range $key := .Values.requiredConfig }}
{{- $_ := required (printf "config.%s is required" $key) (get $.Values.config $key) }}
{{- end }}
{{- /* The datasource/TLS guard runs at the top of deployment.yaml and migration-job.yaml (accounts.validateTls); a failure there stops this render too. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accounts.name" . }}
  labels:
    {{- include "accounts.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key | quote }}: {{ $value | quote }}
  {{- end }}
