          refuse 'extraEnv must not set S\]PRING\.profiles\.active \(value or valueFrom\): a profile can activate' --set-json 'extraEnv=[{"name": "S]PRING.profiles.active", "value": "local"}]'
          refuse 'extraEnv\.spring\.kafka\.security\.proto\]col must be SASL_SSL or SSL' --set-json 'extraEnv=[{"name": "spring.kafka.security.proto]col", "value": "PLAINTEXT"}]'
          helm template ci "$chart" $args $required --set-json 'extraEnv=[{"name": "spring.kafka.properties[client.id]", "value": "accounts-ledger"}]' > /dev/null
          # --- ported from scripts/ci/validate-chart.sh must_fail cases (cicd-templates 6b6c317)
          refuse 'config.DB_URL must set sslmode exactly once' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&sslmode=require'
          refuse 'config.DB_URL must be a jdbc:' --set-string 'config.DB_URL=postgresql://db.example.internal:5432/db?sslmode=disable'
          refuse 'config.db.url is DB_URL in another spelling' --set-string 'config.db\.url=jdbc:postgresql://db.example.internal:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem'
          refuse 'extraEnv must not set SPRING_DATASOURCE_URL' --set 'extraEnv[0].name=SPRING_DATASOURCE_URL' --set-string 'extraEnv[0].value=jdbc:postgresql://db.example.internal:5432/db?sslmode=require'
          refuse 'extraEnv must not set SPRING_R2DBC_URL' --set 'extraEnv[0].name=SPRING_R2DBC_URL' --set-string 'extraEnv[0].valueFrom.secretKeyRef.name=other' --set-string 'extraEnv[0].valueFrom.secretKeyRef.key=url'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention' --set 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-Dspring.datasource.url=jdbc:postgresql://db.example.internal:5432/db'
          refuse 'extraEnv must not set SPRING_PROFILES_ACTIVE' --set 'extraEnv[0].name=SPRING_PROFILES_ACTIVE' --set-string 'extraEnv[0].value=local'
          refuse 'config.SPRING_CONFIG_IMPORT is not allowed' --set-string config.SPRING_CONFIG_IMPORT=optional:file:/tmp/override.yml
          refuse 'config.spring.config.activate.on-profile is not allowed' --set-string 'config.spring\.config\.activate\.on-profile=local'
          refuse 'extraEnv must not set SPRING_CONFIG_IMPORT_0_' --set 'extraEnv[0].name=SPRING_CONFIG_IMPORT_0_' --set-string 'extraEnv[0].value=optional:file:/tmp/override.yml'
          refuse 'config.SPRING_SSL_BUNDLE_PEM_DOCUMENTDB_TRUSTSTORE_CERTIFICATE is not allowed' --set-string config.SPRING_SSL_BUNDLE_PEM_DOCUMENTDB_TRUSTSTORE_CERTIFICATE=file:/tmp/any-ca.pem
          refuse 'extraEnv must not set DB_SSL_ROOT_CERT' --set 'extraEnv[0].name=DB_SSL_ROOT_CERT' --set-string 'extraEnv[0].value='
          refuse 'config.PGJDBC_SSL_FACTORY is not allowed' --set-string config.PGJDBC_SSL_FACTORY=org.postgresql.ssl.NonValidatingFactory
          refuse 'extraEnvFrom is not supported' --set-string 'extraEnvFrom[0].configMapRef.name=other'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention' --set 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=@/tmp/jvm.args'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention' --set 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-Dspring..config.import=optional:file:/tmp/override.yml'
          refuse 'extraEnv.JDK_JAVA_OPTIONS must not contain .[$][(]' --set 'extraEnv[0].name=FBX_Y' --set-string 'extraEnv[0].valueFrom.secretKeyRef.name=other' --set-string 'extraEnv[0].valueFrom.secretKeyRef.key=flags' --set 'extraEnv[1].name=JDK_JAVA_OPTIONS' --set-string 'extraEnv[1].value=$(FBX_Y)'
          refuse 'config.DB_URL must not contain' --set-string 'config.DB_URL=jdbc:postgresql://db.example.internal:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem&x=${FBX_TAIL}'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention' --set 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-Djava.security.properties==/tmp/override.security'
          refuse 'config.FINTECHBANKX_TLS_ENFORCE is not allowed' --set-string config.FINTECHBANKX_TLS_ENFORCE=false
          refuse 'config.SPRING_PROFILES_DEFAULT is not allowed' --set-string config.SPRING_PROFILES_DEFAULT=local
          refuse 'kafka\.flavour must be msk or strimzi' --set-string kafka.flavour=local
          refuse 'config.KAFKA_SECURITY_PROTOCOL must be SASL_SSL or SSL' --set-string kafka.flavour=msk --set-string config.KAFKA_SECURITY_PROTOCOL=PLAINTEXT
          refuse 'must be SSL with kafka.runtime strimzi' --set-string kafka.flavour=strimzi --set-string config.KAFKA_SECURITY_PROTOCOL=SASL_SSL
          refuse 'config.SPRING_KAFKA_SSL_TRUST_STORE_LOCATION is not allowed: a Kafka client TLS setting' --set-string kafka.flavour=msk --set-string config.SPRING_KAFKA_SSL_TRUST_STORE_LOCATION=file:/etc/other/any.jks
          refuse 'extraEnv must not set SPRING_KAFKA_PRODUCER_PROPERTIES_SSL_TRUSTSTORE_CERTIFICATES' --set 'extraEnv[0].name=SPRING_KAFKA_PRODUCER_PROPERTIES_SSL_TRUSTSTORE_CERTIFICATES' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.name=other' --set-string 'extraEnv[0].valueFrom.configMapKeyRef.key=ca'
          refuse 'extraEnv KAFKA_TLS_CA must come from valueFrom.secretKeyRef' --set-string kafka.flavour=strimzi --set 'extraEnv[0].name=KAFKA_TLS_CA' --set-string 'extraEnv[0].value=-----BEGIN CERTIFICATE-----'
          refuse 'config.KAFKA_TLS_CERT is not allowed' --set-string kafka.flavour=strimzi --set-string 'config.KAFKA_TLS_CERT=-----BEGIN CERTIFICATE-----'
          refuse 'extraEnv MONGODB_URI must come from valueFrom.secretKeyRef' --set 'extraEnv[0].name=MONGODB_URI' --set-string 'extraEnv[0].value=mongodb://docdb.example.internal:27017/db?tls=false'
          refuse 'extraEnv\.JAVA_TOOL_OPTIONS must not mention .*kafka' --set 'extraEnv[0].name=JAVA_TOOL_OPTIONS' --set-string 'extraEnv[0].value=-Dspring.kafka.bootstrap-servers=other.example.internal:9092'
          # The chart always sets kafka.runtime (kafka.flavour, default msk), so the guard's "kafka.runtime is empty" case reads as a wrong protocol here.
          refuse 'config\.KAFKA_SECURITY_PROTOCOL must be SASL_SSL with kafka\.runtime msk' --set-string config.KAFKA_SECURITY_PROTOCOL=SSL
          refuse 'config.spring.pro_files.active is not allowed' --set-string 'config.spring\.pro_files\.active=local'
          refuse 'databaseCa.mountPath must be /etc/fintechbankx/rds-ca' --set-string databaseCa.mountPath=/app/config
          # PodDisruptionBudget minAvailable: an integer or a percentage string; anything else is refused, never coerced to 0.
          grep -q '^  minAvailable: 2$' <<<"$(helm template ci "$chart" $args $required --show-only templates/pdb.yaml)"
          grep -q '^  minAvailable: 3$' <<<"$(helm template ci "$chart" $args $required --set podDisruptionBudget.minAvailable=3 --show-only templates/pdb.yaml)"
          grep -q '^  minAvailable: "50%"$' <<<"$(helm template ci "$chart" $args $required --set-string podDisruptionBudget.minAvailable=50% --show-only templates/pdb.yaml)"
          for bad in abc 50 '5000%' '%' "$(printf '50%%\nx')"; do
            refuse 'podDisruptionBudget\.minAvailable must be an integer or a percentage string' --set-string "podDisruptionBudget.minAvailable=$bad"
          done
          # Platform round 7: the migration Job runs as its own hook ServiceAccount (no token, no IAM
          # role), created before the Job, never the chart's account or the namespace default.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml==6.0.2
          helm template ci "$chart" $args $required | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          job = [d for d in docs if d["kind"] == "Job"][0]
          name = job["spec"]["template"]["spec"].get("serviceAccountName")
          sas = {d["metadata"]["name"]: d for d in docs if d["kind"] == "ServiceAccount"}
          assert name and name in sas, (name, sorted(sas))
          sa = sas[name]["metadata"]
          dep = [d for d in docs if d["kind"] == "Deployment"][0]["spec"]["template"]["spec"]
          assert name != dep.get("serviceAccountName"), name
          assert sa["annotations"]["helm.sh/hook"] == job["metadata"]["annotations"]["helm.sh/hook"], sa
          assert int(sa["annotations"]["helm.sh/hook-weight"]) < int(job["metadata"]["annotations"]["helm.sh/hook-weight"]), sa
          assert sas[name].get("automountServiceAccountToken") is False and not sa.get("annotations", {}).get("eks.amazonaws.com/role-arn"), sa
          assert job["spec"]["template"]["spec"]["automountServiceAccountToken"] is False
          print("migration Job runs as hook ServiceAccount", name)'

  terraform:
    name: deploy/terraform
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
