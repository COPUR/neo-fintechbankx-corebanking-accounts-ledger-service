apiVersion: v1
kind: Service
metadata:
  name: {{ include "accounts.name" . | quote }}
  labels:
    {{- include "accounts.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "accounts.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port | int }}
      targetPort: http
    - name: http-management
      port: {{ .Values.service.managementPort | int }}
      targetPort: management
