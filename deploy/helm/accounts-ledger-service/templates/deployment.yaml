{{- include "accounts.validateTls" $ }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "accounts.name" . }}
  labels:
    {{- include "accounts.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | int }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "accounts.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "accounts.selectorLabels" . | nindent 8 }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        app: {{ .Values.serviceAccount.name | quote }}
        version: {{ .Values.image.tag | quote }}
        fintechbankx.io/squad: {{ .Values.squad | quote }}
      annotations:
        sidecar.istio.io/inject: "true"
        # Keep the sidecar draining for longer than the app's graceful shutdown,
        # within terminationGracePeriodSeconds.
        proxy.istio.io/config: '{"terminationDrainDuration": "55s"}'
        {{- if eq .Values.kafka.flavour "strimzi" }}
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.kafka.strimzi.excludeOutboundPorts | quote }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      # Above the sidecar drain (55 s) so neither is killed mid-drain.
      terminationGracePeriodSeconds: 65
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "accounts.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "accounts.selectorLabels" . | nindent 14 }}
      containers:
        - name: accounts-ledger-service
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | int }}
            - name: management
              containerPort: {{ .Values.service.managementPort | int }}
          envFrom:
            - configMapRef:
                name: {{ include "accounts.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "accounts.secretName" . }}
            {{- end }}
          env:
            # Path of the mounted RDS CA bundle (cicd-templates 4f0f266).
            - name: DB_SSL_ROOT_CERT
              value: {{ printf "%s/%s" (trimSuffix "/" .Values.databaseCa.mountPath) .Values.databaseCa.key | quote }}
            # Migrations run only in the pre-install/pre-upgrade Job as the
            # schema owner; the pods hold the runtime role and never migrate.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            # The only profile and Kafka protocol a pod can run with, from kafka.flavour:
            # kafka-msk + SASL_SSL or kafka-strimzi + SSL (fbx.kafkaProfile). config and
            # extraEnv may not name SPRING_PROFILES_*, JVM options may not mention
            # spring.profiles, and any KAFKA_SECURITY_PROTOCOL they set must equal this
            # one (fbx.guard), so the image's local profile can never be activated.
            - name: SPRING_PROFILES_ACTIVE
              value: {{ include "accounts.kafkaProfile" . | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ include "accounts.kafkaSecurityProtocol" . | quote }}
          {{- if eq .Values.kafka.flavour "strimzi" }}
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.strimzi.tlsSecretName | quote }}
                  key: user.crt
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.strimzi.tlsSecretName | quote }}
                  key: user.key
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ required "kafka.strimzi.clusterCaSecretName is required" .Values.kafka.strimzi.clusterCaSecretName | quote }}
                  key: ca.crt
          {{- else if ne .Values.kafka.flavour "msk" }}
          {{- fail "kafka.flavour must be msk or strimzi" }}
          {{- end }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: database-ca
              mountPath: {{ .Values.databaseCa.mountPath | quote }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Platform ConfigMap (trust-manager); the chart ships no copy of the bundle.
        - name: database-ca
          configMap:
            name: {{ .Values.databaseCa.configMapName | quote }}
            items:
              - key: {{ .Values.databaseCa.key | quote }}
                path: {{ .Values.databaseCa.key | quote }}
