# In-cluster Strimzi TLS listener (Helm kafka.flavour=strimzi): mutual TLS with
# the KafkaUser client certificate, bound from Secret kafka-client-tls (PEM) as
# KAFKA_TLS_CERT, KAFKA_TLS_KEY and KAFKA_TLS_CA.
spring:
  kafka:
    security:
      protocol: SSL
    ssl:
      key-store-type: PEM
      trust-store-type: PEM
      key-store-certificate-chain: ${KAFKA_TLS_CERT}
      key-store-key: ${KAFKA_TLS_KEY}
      trust-store-certificates: ${KAFKA_TLS_CA}
