pluginManagement {
    repositories {
        gradlePluginPortal()
        // The Spring Boot plugin's own dependencies are only on Maven Central.
        mavenCentral()
    }
}

rootProject.name = 'neo-fintechbankx-corebanking-accounts-ledger-service'

include 'shared-kernel'
include 'accounts-domain'
include 'accounts-application'
include 'accounts-infrastructure'
include 'accounts-bootstrap'
