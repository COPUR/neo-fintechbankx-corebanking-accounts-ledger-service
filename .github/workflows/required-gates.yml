name: Required Gates
# CI_RUNNER (a repository or organization variable) names the runner label that runs every job in this file.
# Unset, the jobs run on GitHub-hosted ubuntu-latest. The self-hosted runner is the arm64 Lima VM that
# governance/ci-runner/setup-fbx-ci-runner.sh registers under the label fbx-ci; set CI_RUNNER to that one label.
# Required on the runner: Java 23 and the Gradle wrapper (through setup-java), Docker for the test job's
# postgres:16-alpine service, passwordless sudo for the oasdiff and gitleaks installs into /usr/local/bin, and
# network access to github.com for those release downloads. Both downloads select the architecture and check the
# release's sha256. No Actions cache is used: Gradle keeps its files in the runner user's ~/.gradle.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  build:
    name: ci/build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -f gradlew ]; then
            GRADLE=gradle
            if [ -x ./gradlew ]; then GRADLE=./gradlew; fi
            if ! $GRADLE --no-daemon clean assemble -x test; then
              if [ -f .ci/allow-gradle-fail ]; then
                echo "Gradle build failed but .ci/allow-gradle-fail is present; continuing."
              else
                exit 1
              fi
            fi
          else
            echo "No Gradle root build in this repository; skipping Gradle build."
          fi
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json build in this repository; skipping Node build."
          fi

  test:
    name: ci/test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db_acc_accounts_ledger_test
          POSTGRES_USER: accounts_test
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U accounts_test -d db_acc_accounts_ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests in accounts-bootstrap run Flyway and the full service against this database.
      TEST_DB_USERNAME: accounts_test
      TEST_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point the tests at this job's database port
        # The fbx-ci runners share one Docker host, so the service publishes no fixed host port.
        run: echo "TEST_DB_URL=jdbc:postgresql://localhost:${{ job.services.postgres.ports['5432'] }}/db_acc_accounts_ledger_test" >> "$GITHUB_ENV"

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -f gradlew ]; then
            GRADLE=gradle
            if [ -x ./gradlew ]; then GRADLE=./gradlew; fi
            # check = unit and integration tests, the ArchUnit rules and the coverage gates.
            if ! $GRADLE --no-daemon check; then
              if [ -f .ci/allow-gradle-fail ]; then
                echo "Gradle check failed but .ci/allow-gradle-fail is present; continuing."
              else
                exit 1
              fi
            fi
          else
            echo "No Gradle root test task in this repository; skipping Gradle test."
          fi
          if [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo "No package.json test in this repository; skipping Node test."
          fi

      - name: Behaviour changes come with tests
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-behaviour-change') }}
        shell: bash
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          if echo "$changed" | grep -qE '(^|/)src/main/' && ! echo "$changed" | grep -qE '(^|/)src/test/'; then
            echo "::error::This PR changes src/main without changing src/test. Add the test that drives the change, or label the PR no-behaviour-change."
            echo "$changed" | grep -E '(^|/)src/main/'
            exit 1
          fi

      - name: OpenAPI contract lint
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        shell: bash
        run: |
          if ls openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint openapi/*.yaml
          elif ls api/openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint api/openapi/*.yaml
          elif ls src/main/resources/openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint src/main/resources/openapi/*.yaml
          fi

      - name: AsyncAPI contract validation
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        shell: bash
        run: |
          for spec in api/asyncapi/*.yaml; do
            npx -y @asyncapi/cli@2.13.0 validate "$spec"
          done

      # ADR-019 section 5 provider gate, the equivalent of cicd-templates 4129ceb's contract-checks
      # asyncapi job until this repository moves to the shared workflows: the catalog's breaking-change
      # rules (scripts copied unchanged from the asyncapi catalog at 44837cc) against the merge base of
      # origin/main. Findings are waived only in api/asyncapi/<spec-name>.accepted-breaking.txt.
      # The gate scripts are copies of the AsyncAPI catalog's at commit 44837cc (README,
      # "Contracts and events"); an edited copy fails here. Re-copy and update both lists together.
      - name: AsyncAPI gate scripts match the catalog copy
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        shell: bash
        run: |
          sha256sum -c --strict - <<'SUMS'
          de255737fe6b54ffbadce8e030e18eec48d0137e0abd43c790fe201a10015eb1  scripts/ci/asyncapi-breaking.mjs
          5b39d588673c5f7ab55fcfa548fffd70b96ab9b11ea82bd2b61468dadb430c77  scripts/ci/asyncapi-breaking.sh
          212df6ca092e1ed5519664d7848c9de5fdb5d137f34faa3d31a25e3fe29b3847  scripts/ci/lib/asyncapi-model.mjs
          SUMS

      - name: AsyncAPI breaking-change check
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/.npm
          ASYNCAPI_DIR: api/asyncapi
          BASE_REF: origin/main
        shell: bash
        run: |
          npm ci --prefix scripts/ci --ignore-scripts --no-audit --no-fund
          bash scripts/ci/asyncapi-breaking.sh

      - name: Install oasdiff
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Pick the asset by runner architecture and check it against the release's sha256 before extracting.
          case "$(uname -m)" in
            x86_64) oasdiff_arch=amd64; oasdiff_sha=85514a6044d9cce53816b3558b17be4f784e481e43bf345b1029a6ccc5c0e439 ;;
            aarch64|arm64) oasdiff_arch=arm64; oasdiff_sha=eff7c6d6d361fc29085925f6871d8b41406baadede6b87a4a055a2b640ac8a05 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/oasdiff.tar.gz" "https://github.com/oasdiff/oasdiff/releases/download/v1.12.1/oasdiff_1.12.1_linux_${oasdiff_arch}.tar.gz"
          echo "${oasdiff_sha}  $tmpdir/oasdiff.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/oasdiff.tar.gz"
          sudo install "$tmpdir/oasdiff" /usr/local/bin/oasdiff
          rm -rf "$tmpdir"

      - name: OpenAPI breaking-change guard
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        run: ./scripts/ci/oasdiff-breaking.sh

      - name: FAPI/DPoP contract guard
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        run: ./scripts/ci/fapi-dpop-guard.sh

      - name: Guardrail - disallow generic map request payloads
        shell: bash
        run: |
          if [ -d src/main/java ]; then
            if grep -R -nE "Map<\s*String\s*,\s*Object\s*>" src/main/java --include="*Controller.java"; then
              echo "Generic Map<String,Object> payloads are disallowed in controllers."
              exit 1
            fi
          else
            echo "No Java controller sources in this repository; guardrail check skipped."
          fi

  security:
    name: ci/security
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Pick the asset by runner architecture and check it against the release's sha256 before extracting.
          case "$(uname -m)" in
            x86_64) gitleaks_arch=x64; gitleaks_sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            aarch64|arm64) gitleaks_arch=arm64; gitleaks_sha=5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_${gitleaks_arch}.tar.gz"
          echo "${gitleaks_sha}  $tmpdir/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/gitleaks.tar.gz"
          sudo install "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmpdir"

      - name: Run gitleaks (workspace scan)
        shell: bash
        run: |
          gitleaks detect --source . --no-banner --redact --no-git --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json || {
              cat gitleaks-report.json
              exit 1
            }
